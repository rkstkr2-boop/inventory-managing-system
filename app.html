<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Shop Inventory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/anim.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo-s">📱</span> Shop Inventory</div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot"><button id="logout"></button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h2 id="title">Dashboard</h2>
        <div class="user-chip">
          <div><b id="uname"></b><small id="urole"></small></div>
          <div class="av" id="uav"></div>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/services.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/views/vendors.js"></script>
  <script src="js/views/sales.js"></script>
  <script src="js/views/stocklog.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
